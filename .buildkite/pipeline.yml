# The tests exercise the real `buildkite-agent` (meta-data, artifacts and
# annotations shared between steps), so they only run on Buildkite. The steps
# after `wait` read what `linux-latest` stored; test/runtests.jl branches on
# each step's `key`.
agents:
  queue: "test"
  arch: "x86_64"
  sched_cpus: "1"
  sched_cpus_limit: "4"
  sched_mem_gib: "4"
  sched_mem_limit_gib: "8"

steps:
  - label: ":linux: latest"
    key: "linux-latest"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1:
          coverage: false
    timeout_in_minutes: 20
    # Don't run Buildkite if the commit message includes the text [skip tests]
    if: build.message !~ /\[skip tests\]/
    agents:
      os: "linux"
      sandbox_capable: "true"

  - wait

  - label: ":linux: v1.10"
    key: "linux-min"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.10"
      - JuliaCI/julia-test#v1:
          coverage: false
    timeout_in_minutes: 20
    if: build.message !~ /\[skip tests\]/
    agents:
      os: "linux"
      sandbox_capable: "true"

  - label: ":macos:"
    key: "macos"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1:
          coverage: false
    timeout_in_minutes: 20
    if: build.message !~ /\[skip tests\]/
    agents:
      os: "macos"

  - label: ":windows:"
    key: "windows"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1:
          coverage: false
    timeout_in_minutes: 20
    if: build.message !~ /\[skip tests\]/
    agents:
      os: "windows"
